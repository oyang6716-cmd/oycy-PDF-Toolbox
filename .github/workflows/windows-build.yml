name: Build Windows executable
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'page_editor_ui.py'
      - 'page_layout.py'
      - 'test_page_layout.py'
      - 'test_editor_gui.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test uniform PDF page merge
        run: python test_merge_pages.py
      - name: Test page layout and PDF vector output
        run: python test_page_layout.py
      - name: Verify GUI startup
        run: python app.py --smoke-test
      - name: Verify page editor GUI
        run: python test_editor_gui.py
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name oycy-PDF-Toolbox --collect-all fitz --collect-all keyring --hidden-import keyring.backends.Windows app.py
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: oycy-PDF-Toolbox-Windows
          path: dist/oycy-PDF-Toolbox.exe
