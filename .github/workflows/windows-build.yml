name: Build Windows executable
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name oycy-PDF-Toolbox --collect-all fitz --collect-all keyring --hidden-import keyring.backends.Windows app.py
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: oycy-PDF-Toolbox-Windows
          path: dist/oycy-PDF-Toolbox.exe
